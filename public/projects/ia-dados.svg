<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <circle cx="400" cy="225" r="300" fill="#3b82f6" opacity="0.05" filter="blur(60px)"/>
  
  <!-- Window mockup -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#0c0d12" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="85" cy="65" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="65" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="119" cy="65" r="5" fill="#10b981" opacity="0.8"/>
  <text x="145" y="69" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="12">ml-credit-risk-evaluator.py</text>
  
  <!-- Content cards -->
  <rect x="85" y="95" width="280" height="280" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
  <text x="105" y="125" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Model Performance (ROC-AUC)</text>
  <text x="105" y="160" fill="#ffffff" font-family="Inter, sans-serif" font-size="28" font-weight="700">96.4%</text>
  <text x="105" y="180" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="11">+4.2% vs baseline logistic</text>
  
  <!-- Metrics Chart representation -->
  <path d="M 105 290 L 145 270 L 185 280 L 225 240 L 265 250 L 305 210 L 340 220" fill="none" stroke="url(#accent1)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="340" cy="220" r="4" fill="#10b981"/>
  
  <!-- Risk Distribution -->
  <rect x="385" y="95" width="330" height="130" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
  <text x="405" y="125" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Classificação de Risco de Crédito</text>
  
  <rect x="405" y="145" width="180" height="10" rx="5" fill="#27272a"/>
  <rect x="405" y="145" width="150" height="10" rx="5" fill="#10b981"/>
  <text x="600" y="154" fill="#a1a1aa" font-family="JetBrains Mono, monospace" font-size="10">Baixo (82%)</text>
  
  <rect x="405" y="170" width="180" height="10" rx="5" fill="#27272a"/>
  <rect x="405" y="170" width="50" height="10" rx="5" fill="#f59e0b"/>
  <text x="600" y="179" fill="#a1a1aa" font-family="JetBrains Mono, monospace" font-size="10">Médio (14%)</text>
  
  <rect x="405" y="195" width="180" height="10" rx="5" fill="#27272a"/>
  <rect x="405" y="195" width="20" height="10" rx="5" fill="#ef4444"/>
  <text x="600" y="204" fill="#a1a1aa" font-family="JetBrains Mono, monospace" font-size="10">Alto (4%)</text>

  <!-- Pipeline Details -->
  <rect x="385" y="240" width="330" height="135" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.06)"/>
  <text x="405" y="268" fill="#a1a1aa" font-family="Inter, sans-serif" font-size="13" font-weight="600">Pipeline de Dados &amp; Treinamento</text>
  <text x="405" y="295" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="11">✓ Preprocessing (Pandas / StandardScaler)</text>
  <text x="405" y="320" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="11">✓ Random Forest &amp; XGBoost Classifier</text>
  <text x="405" y="345" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="11">✓ F1-Score: 0.94 | Precision: 0.95</text>
</svg>

