<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="60%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  
  <!-- Canvas window -->
  <rect x="60" y="45" width="680" height="360" rx="14" fill="#09090b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <circle cx="85" cy="65" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="102" cy="65" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="119" cy="65" r="5" fill="#10b981" opacity="0.8"/>
  <text x="145" y="69" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="12">drew-gesture-canvas.app · Live Webcam Tracking</text>
  
  <!-- Video Feed overlay (left) -->
  <rect x="85" y="95" width="220" height="280" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.08)"/>
  <!-- Simulated hand landmarks -->
  <circle cx="180" cy="220" r="14" fill="#a855f7" opacity="0.25"/>
  <circle cx="180" cy="220" r="6" fill="#a855f7"/>
  <circle cx="195" cy="170" r="4" fill="#ec4899"/>
  <circle cx="215" cy="185" r="4" fill="#ec4899"/>
  <circle cx="225" cy="210" r="4" fill="#ec4899"/>
  <line x1="180" y1="220" x2="195" y2="170" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="180" y1="220" x2="215" y2="185" stroke="#ec4899" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="105" y="125" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="600">Vision Tracker</text>
  <rect x="105" y="140" width="85" height="20" rx="10" fill="#22c55e" fill-opacity="0.2"/>
  <text x="115" y="154" fill="#4ade80" font-family="JetBrains Mono, monospace" font-size="10">● Gesture: Draw</text>
  <text x="105" y="340" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="10">FPS: 60 · Latency: 12ms</text>

  <!-- Drawing canvas (right) -->
  <rect x="325" y="95" width="390" height="280" rx="10" fill="#030712" stroke="rgba(255,255,255,0.06)"/>
  
  <!-- Glowing Drawn Path -->
  <path d="M 370 240 Q 420 130 500 200 T 630 180 T 670 280" fill="none" stroke="url(#glowLine)" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 12px rgba(168,85,247,0.7))"/>
  
  <!-- Toolbar pill -->
  <rect x="420" y="325" width="200" height="36" rx="18" fill="#1f2937" stroke="rgba(255,255,255,0.15)"/>
  <circle cx="445" cy="343" r="8" fill="#a855f7"/>
  <circle cx="475" cy="343" r="8" fill="#ec4899"/>
  <circle cx="505" cy="343" r="8" fill="#3b82f6"/>
  <circle cx="535" cy="343" r="8" fill="#ffffff"/>
  <text x="560" y="347" fill="#9ca3af" font-family="Inter, sans-serif" font-size="11">Clear</text>
</svg>

